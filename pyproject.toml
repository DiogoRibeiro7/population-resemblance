[tool.poetry]
name = "population-resemblance"
version = "0.1.0"
description = "Statistically principled monitoring of categorical population and distribution shifts."
authors = ["Diogo Ribeiro"]
readme = "README.md"
packages = [{ include = "population_resemblance", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.1"
scipy = "^1.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
mypy = "^1.11"
ruff = "^0.6"
pre-commit = "^3.8"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
