[tool.poetry]
name = "population-resemblance"
version = "0.1.0"
description = "Statistically principled monitoring of categorical population and distribution shifts."
authors = ["Diogo Ribeiro"]
readme = "README.md"
packages = [{ include = "population_resemblance", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.1"
scipy = "^1.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.7"
mypy = "^1.13"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["population_resemblance"]
mypy_path = "src"
