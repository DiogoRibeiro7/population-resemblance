[tool.poetry]
requires-poetry = ">=2.5,<2.6"
name = "population-resemblance"
version = "0.1.0"
description = "Statistically principled monitoring of categorical population and distribution shifts."
authors = ["Diogo Ribeiro"]
license = "MIT"
readme = "README.md"
homepage = "https://diogoribeiro7.github.io/population-resemblance/"
repository = "https://github.com/DiogoRibeiro7/population-resemblance"
documentation = "https://diogoribeiro7.github.io/population-resemblance/"
keywords = [
  "population-drift",
  "distribution-shift",
  "model-monitoring",
  "population-stability-index",
  "chi-square",
  "statistics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
packages = [{ include = "population_resemblance", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.1"
scipy = "^1.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
mypy = "^1.11"
scipy-stubs = "*"
ruff = "^0.6"
pre-commit = "^3.8"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = { version = "^0.26", extras = ["python"] }

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
