name: PEP 621 Lock Bootstrap

on:
  push:
    branches: [chore/pep621-metadata]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/pep621-metadata

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Refresh lockfile
        run: poetry lock

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git diff --cached --quiet || git commit -m "build: refresh lockfile for PEP 621 metadata"
          git push origin HEAD:chore/pep621-metadata
