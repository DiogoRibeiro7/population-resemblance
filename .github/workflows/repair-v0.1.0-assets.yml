name: Repair v0.1.0 release assets

on:
  push:
    branches: [fix/release-asset-upload]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v0.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Build distributions
        run: poetry build

      - name: Attach distributions to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
