name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --with docs

      - name: Validate project metadata
        run: poetry check --lock

      - name: Check PEP 621 metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          required = {
              "name",
              "version",
              "description",
              "authors",
              "license",
              "readme",
              "requires-python",
              "keywords",
              "classifiers",
          }
          missing = required.difference(project)
          if missing:
              raise SystemExit(f"missing PEP 621 metadata: {sorted(missing)}")
          PY

      - name: Ruff
        run: poetry run ruff check .

      - name: Mypy
        run: poetry run mypy src tests

      - name: Tests
        run: poetry run pytest --ignore=tests/test_documentation.py --cov=population_resemblance --cov-report=term-missing

      - name: Execute README and documentation examples
        run: poetry run pytest tests/test_documentation.py -v

      - name: Reproduce published calibration examples
        run: |
          poetry run python examples/reproduce_table2.py
          poetry run python examples/reproduce_table3.py
          poetry run python examples/reproduce_deviation_grid.py --simulations 200

      - name: Benchmark chunked Monte Carlo smoke test
        run: poetry run python examples/benchmark_chunked_simulation.py --simulations 1000 --batch-size 100

      - name: Run end-to-end examples
        run: |
          poetry run python examples/workflow_single_and_named.py
          poetry run python examples/workflow_temporal_and_diagnostics.py
          poetry run python examples/workflow_calibration_and_comparison.py
          poetry run python examples/workflow_export.py

      - name: Validate two-sample research algebra
        run: poetry run python research/validate_two_sample_asymptotics.py

      - name: Validate two-sample critical-value research
        run: poetry run python research/validate_two_sample_critical_values.py

      - name: Simulate two-sample finite-sample calibration
        run: poetry run python research/simulate_two_sample_calibration.py --simulations 5000

      - name: Validate two-sample overlap correction
        run: poetry run python research/validate_two_sample_overlap.py

      - name: Documentation
        run: poetry run mkdocs build --strict

      - name: Build release distributions
        run: poetry build

      - name: Validate release distributions
        run: pipx run --spec twine==7.0.0 twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv .ci-release-venv
          .ci-release-venv/bin/python -m pip install --upgrade pip
          .ci-release-venv/bin/python -m pip install dist/*.whl
          .ci-release-venv/bin/python -c "import population_resemblance"

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install test dependencies
        run: poetry install --without docs

      - name: Run tests
        run: poetry run pytest
