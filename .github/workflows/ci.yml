name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/reproducible-installs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --with docs

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git diff --cached --quiet || git commit -m "build: add Poetry lockfile"
          git push origin HEAD:chore/reproducible-installs

      - name: Validate project metadata
        run: poetry check

      - name: Ruff
        run: poetry run ruff check .

      - name: Mypy
        run: poetry run mypy src tests

      - name: Tests
        run: poetry run pytest --cov=population_resemblance --cov-report=term-missing

      - name: Documentation
        run: poetry run mkdocs build --strict
