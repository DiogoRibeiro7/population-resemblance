name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --with docs

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: poetry-lock
          path: poetry.lock

      - name: Validate project metadata
        run: poetry check

      - name: Ruff
        run: poetry run ruff check .

      - name: Mypy
        run: poetry run mypy src tests

      - name: Tests
        run: poetry run pytest --cov=population_resemblance --cov-report=term-missing

      - name: Documentation
        run: poetry run mkdocs build --strict
